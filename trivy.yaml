---
# Config file for Trivy.
exit-code: 1

skip-version-check: false

format: table

ignorefile: .trivyignore.yaml

pkg:
  type:
    - os
    - library

scan:
  disable-telemetry: true
  show-suppressed: true
  skip-files: []

severity:
  - MEDIUM
  - CRITICAL
  - HIGH

scanners:
  - vuln

vulnerability:
  ignore-unfixed: true

image:
  show-suppressed: true
